name: Diagnose existing APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-apk.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Metin2-Nistor-ARM64
          run-id: 39321786040
          github-token: ${{ github.token }}
          path: apk
      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          cd apk
          sha256sum -c SHA256SUMS.txt
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$sdk_tools/apksigner" verify --verbose --print-certs Metin2-Nistor-ARM64.apk
          "$sdk_tools/aapt" dump badging Metin2-Nistor-ARM64.apk
          "$sdk_tools/aapt" dump xmltree Metin2-Nistor-ARM64.apk AndroidManifest.xml
          python3 - <<'PY'
          import zipfile, struct
          with zipfile.ZipFile('Metin2-Nistor-ARM64.apk') as z:
              print('ZIP CRC check:', z.testzip())
              for i in z.infolist():
                  if i.filename.endswith('.so'):
                      b=z.read(i)
                      print('NATIVE', i.filename, 'compression', i.compress_type, 'size',len(b))
                      if b[:4]==b'\x7fELF' and b[4]==2:
                          off=struct.unpack_from('<Q',b,32)[0]
                          ents,num=struct.unpack_from('<HH',b,54)
                          aligns=[struct.unpack_from('<Q',b,off+n*ents+48)[0] for n in range(num) if struct.unpack_from('<I',b,off+n*ents)[0]==1]
                          print('LOAD alignments:', aligns)
          PY
